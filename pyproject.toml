[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoframe"
version = "0.3.0"
description = "A unified local workbench for lightweight iteration and resumable agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RepoFrame contributors"}]
keywords = ["agents", "developer-tools", "dag", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.scripts]
repoframe = "repoframe.cli:main"

[project.urls]
Repository = "https://github.com/dddkl/RepoFrame"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repoframe.resources" = ["*.json", "*.md"]
"repoframe.web" = ["*.html", "*.css", "*.js"]
