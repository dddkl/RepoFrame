name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Smoke CLI
        run: |
          repoframe --help
          repoframe validate --help
          repoframe view --help

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and verify resources
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          repoframe --version
          repoframe init --agents none
          repoframe init --goal "Package smoke" --agents none
          repoframe validate
